# ============================================
# Configuración de SonarScanner para OWASP NodeGoat
# Demo SAST - IsraelStarTeam
# Rama: demo/sonarqube
# ============================================

# Identificador único del proyecto en SonarQube
sonar.projectKey=israel-startteam-nodegoat
sonar.projectName=OWASP NodeGoat - Demo SAST
sonar.projectVersion=1.0

# Código fuente a analizar (el usuario clona NodeGoat en demo/sonarqube/nodegoat)
sonar.sources=./nodegoat

# Extensiones de archivo a incluir en el análisis (JavaScript/Node.js)
sonar.inclusions=**/*.js,**/*.jsx,**/*.json

# Archivos y directorios a excluir del análisis
sonar.exclusions=node_modules/**,.git/**,public/**,test/**,coverage/**,logs/**,**/node_modules/**

# Codificación de archivos
sonar.sourceEncoding=UTF-8

# Lenguaje de programación
sonar.language=js

# Ruta del reporte de cobertura (si se genera con nyc/istanbul)
# sonar.coverage.reportPaths=./nodegoat/coverage/lcov.info

# URL del servidor SonarQube (local vía Docker o SonarCloud)
sonar.host.url=http://localhost:9000

# Token de autenticación de SonarQube (cargado desde .env)
# sonar.login=${SONAR_TOKEN}
